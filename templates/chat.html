<!DOCTYPE html>
<html>
<head>
    <title>Medical Chatbot</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 400px; background-color: white; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; }
        .header { background-color: #007bff; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .messages { flex-grow: 1; height: 400px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 20px; max-width: 80%; word-wrap: break-word; }
        .user-msg { background-color: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-msg { background-color: #e9ecef; color: black; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { display: flex; padding: 10px; border-top: 1px solid #ddd; background-color: #f8f9fa; }
        input[type="text"] { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 50%; margin-left: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">Medical Chatbot</div>
        <div class="messages" id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ask a medical question..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $("#send-btn").click(function() {
                var userMsg = $("#user-input").val();
                if(userMsg.trim() === "") return;
                
                $("#chat-box").append('<div class="message user-msg">' + userMsg + '</div>');
                $("#user-input").val("");
                $('#chat-box').scrollTop($('#chat-box')[0].scrollHeight);

                $.ajax({
                    type: "POST",
                    url: "/get",
                    data: { msg: userMsg },
                    success: function(response) {
                        $("#chat-box").append('<div class="message bot-msg">' + response + '</div>');
                        $('#chat-box').scrollTop($('#chat-box')[0].scrollHeight);
                    }
                });
            });

            $("#user-input").keypress(function(e) {
                if(e.which == 13) {
                    $("#send-btn").click();
                }
            });
        });
    </script>
</body>
</html>
